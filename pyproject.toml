[project]
name = "software-factory-skills"
version = "0.1.0"
description = "Reusable skills for controlled AI software-engineering workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
# This project ships no importable Python package. Every script is run by path,
# and the skill directories are hyphenated, so none of them is a valid module
# name. Without this, setuptools tries flat-layout auto-discovery and refuses
# the build because it finds both `schemas` and `standards` at the top level.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
